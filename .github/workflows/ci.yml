name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_NO_SOURCES: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev --python "${{ steps.setup-python.outputs.python-path }}"

      - name: Run Ruff check
        run: uv run ruff check src/ tests/ examples/ scripts/

      - name: Run Ruff format check
        run: uv run ruff format --check src/ tests/ examples/ scripts/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev --python "${{ steps.setup-python.outputs.python-path }}"

      - name: Run ty check
        run: uv run ty check

      - name: Type-check CI scripts
        run: >-
          uv run ty check scripts/ci/candidate.py scripts/ci/check_coverage.py
          scripts/ci/check_performance.py scripts/ci/hardware_qualification.py
          scripts/ci/performance_qualification.py scripts/ci/test_wheel.py

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev --python "${{ steps.setup-python.outputs.python-path }}"

      - name: Measure coverage
        run: uv run pytest tests/ -q --cov-report=json:coverage.json

      - name: Enforce coverage thresholds
        run: uv run python scripts/ci/check_coverage.py coverage.json

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev --extra docs --python "${{ steps.setup-python.outputs.python-path }}"

      - name: Build docs
        run: uv run mkdocs build --strict

  build-candidate:
    name: Build Candidate
    runs-on: ubuntu-latest
    needs: [lint, typecheck, coverage, docs]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build checks
        run: uv sync --dev --python "${{ steps.setup-python.outputs.python-path }}"

      - name: Build candidate
        run: uv build --out-dir candidate/dist

      - name: Record candidate identity
        run: >-
          uv run python scripts/ci/candidate.py create candidate
          --commit-sha "${{ github.sha }}"
          --git-tree "$(git rev-parse HEAD^{tree})"

      - name: Verify package metadata
        run: uv run twine check candidate/dist/*

      - name: Verify candidate manifest
        run: >-
          uv run python scripts/ci/candidate.py verify candidate
          --expected-commit "${{ github.sha }}"
          --expected-tree "$(git rev-parse HEAD^{tree})"

      - name: Upload candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: candidate/
          if-no-files-found: error

  stable-platform:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: build-candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: candidate

      - name: Verify candidate identity
        run: >-
          python scripts/ci/candidate.py verify candidate
          --expected-commit "${{ github.sha }}"

      - name: Install development environment
        run: uv sync --dev --python "${{ steps.setup-python.outputs.python-path }}"

      - name: Run source tests
        run: uv run pytest tests/ -q --tb=short

      - name: Run type check
        run: uv run ty check

      - name: Rebuild wheel
        run: >-
          uv build --wheel --out-dir rebuilt-dist
          --python "${{ steps.setup-python.outputs.python-path }}"

      - name: Verify platform-independent wheel contents
        run: python scripts/ci/candidate.py compare-wheel candidate rebuilt-dist

      - name: Verify byte-identical canonical wheel
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: >-
          python scripts/ci/candidate.py compare-wheel candidate rebuilt-dist
          --require-byte-identical

      - name: Test installed candidate
        run: >-
          python scripts/ci/test_wheel.py candidate
          --python-version "${{ steps.setup-python.outputs.python-path }}"
          --mode full

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: build-candidate
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Download candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: candidate

      - name: Audit current contributor environment
        run: |
          uv sync --dev --extra docs --python "${{ steps.setup-python.outputs.python-path }}"
          uv run --with pip-audit --with 'setuptools>=83.0.0' python -m pip_audit \
            --progress-spinner off

      - name: Audit supported minimum dependencies
        run: |
          wheel="$(find candidate/dist -name '*.whl' -print -quit)"
          uv venv .audit-minimum --python "${{ steps.setup-python.outputs.python-path }}"
          uv pip install --python .audit-minimum/bin/python \
            "${wheel}[all]" \
            'numpy==1.26.0' \
            'torch==2.13.0' \
            'polars==1.0.0' \
            'ml4t-specs==0.1.0b0' \
            'pytest==9.0.3' \
            'setuptools>=83.0.0' \
            pip-audit
          .audit-minimum/bin/python -m pip_audit --progress-spinner off

  python-prerelease:
    name: ${{ matrix.os }} / Python 3.15 prerelease
    runs-on: ${{ matrix.os }}
    needs: build-candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"

      - name: Set up current Python prerelease
        id: setup-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.15"
          allow-prereleases: true
          check-latest: true

      - name: Download candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: candidate

      - name: Verify candidate identity
        run: >-
          python scripts/ci/candidate.py verify candidate
          --expected-commit "${{ github.sha }}"

      - name: Test installed core candidate
        run: >-
          python scripts/ci/test_wheel.py candidate
          --python-version "${{ steps.setup-python.outputs.python-path }}"
          --mode core

  mps-smoke:
    name: MPS Neural Qualification
    runs-on: macos-15
    needs: build-candidate
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: candidate

      - name: Install candidate
        run: |
          wheel="$(find candidate/dist -name '*.whl' -print -quit)"
          uv venv .mps-venv --python "${{ steps.setup-python.outputs.python-path }}"
          uv pip install --python .mps-venv/bin/python "${wheel}[all]"

      - name: Qualify public neural workflows on MPS
        run: >-
          .mps-venv/bin/python scripts/ci/hardware_qualification.py
          --device mps --output mps-qualification.json

      - name: Upload MPS evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mps-qualification
          path: mps-qualification.json
          if-no-files-found: error

  cuda-qualification:
    name: RTX 3090 CUDA and Performance Qualification
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, cuda, rtx-3090]
    needs: build-candidate
    timeout-minutes: 180
    env:
      CUBLAS_WORKSPACE_CONFIG: ":4096:8"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Download candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: candidate

      - name: Verify candidate identity
        run: >-
          python scripts/ci/candidate.py verify candidate
          --expected-commit "${{ github.sha }}"

      - name: Install candidate
        run: |
          wheel="$(find candidate/dist -name '*.whl' -print -quit)"
          uv venv .cuda-venv --python "${{ steps.setup-python.outputs.python-path }}"
          uv pip install --python .cuda-venv/bin/python "${wheel}[all]"

      - name: Qualify public neural workflows on CUDA
        run: >-
          .cuda-venv/bin/python scripts/ci/hardware_qualification.py
          --device cuda
          --expected-cuda-device "NVIDIA GeForce RTX 3090"
          --expected-cuda-capability 8.6
          --output cuda-qualification.json

      - name: Run repeated Chapter 14 profiles
        run: |
          for repetition in 1 2 3; do
            .cuda-venv/bin/python scripts/ci/performance_qualification.py \
              --profile canonical \
              --device cuda \
              --output "performance-${repetition}.json" \
              --arrays "performance-${repetition}.npz"
            .cuda-venv/bin/python scripts/ci/performance_qualification.py \
              --profile scaling \
              --device cuda \
              --output "scaling-${repetition}.json" \
              --arrays "scaling-${repetition}.npz"
          done

      - name: Check performance and replay limits
        run: >-
          .cuda-venv/bin/python scripts/ci/check_performance.py
          --records performance-1.json performance-2.json performance-3.json
          --arrays performance-1.npz performance-2.npz performance-3.npz

      - name: Check scaling stability and replay limits
        run: >-
          .cuda-venv/bin/python scripts/ci/check_performance.py
          --records scaling-1.json scaling-2.json scaling-3.json
          --arrays scaling-1.npz scaling-2.npz scaling-3.npz

      - name: Upload CUDA and performance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cuda-performance-qualification
          path: |
            cuda-qualification.json
            performance-*.json
            performance-*.npz
            scaling-*.json
            scaling-*.npz
          if-no-files-found: error

  qualify:
    name: Qualify Candidate
    if: always()
    runs-on: ubuntu-latest
    needs: [stable-platform, python-prerelease, dependency-audit, cuda-qualification]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Verify prerequisite outcomes
        env:
          CUDA_RESULT: ${{ needs.cuda-qualification.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-audit.result }}
          EVENT_NAME: ${{ github.event_name }}
          PYTHON_RESULT: ${{ needs.python-prerelease.result }}
          REF_NAME: ${{ github.ref }}
          STABLE_RESULT: ${{ needs.stable-platform.result }}
        run: |
          test "$STABLE_RESULT" = success
          test "$PYTHON_RESULT" = success
          test "$DEPENDENCY_RESULT" = success
          if [[ "$EVENT_NAME" = push && "$REF_NAME" = refs/heads/main ]]; then
            test "$CUDA_RESULT" = success
          else
            test "$CUDA_RESULT" = skipped
          fi

      - name: Download candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: candidate

      - name: Verify qualified candidate
        run: >-
          python scripts/ci/candidate.py verify candidate
          --expected-commit "${{ github.sha }}"
