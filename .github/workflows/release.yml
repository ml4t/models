name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version without the v prefix
        required: true
        type: string
      candidate_commit:
        description: Full commit SHA currently at the tip of main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Release Request
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      tree: ${{ steps.identity.outputs.tree }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0

      - name: Fetch current main and release tags
        run: git fetch origin main --tags

      - name: Require the current main commit and an unused version
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/ci/release.py preflight
          --version "${{ inputs.version }}"
          --candidate-commit "${{ inputs.candidate_commit }}"
          --workflow-commit "${{ github.sha }}"
          --repository "${{ github.repository }}"

      - name: Record accepted release identity
        id: identity
        run: |
          {
            echo "commit=${{ inputs.candidate_commit }}"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "version=${{ inputs.version }}"
          } >> "$GITHUB_OUTPUT"

  ecosystem-qualification:
    name: Ecosystem Qualification
    needs: validate
    permissions:
      contents: read
    uses: ml4t/ecosystem/.github/workflows/qualify-library.yml@da2cbb9a9d0b4d2f166ad630470ff7d7a1aa2643 # 2026-09-19 policy snapshot
    with:
      import-package: ml4t.models
      prerelease-test-paths: >-
        ["tests/test_configs.py", "tests/test_forecasters.py", "tests/test_integration_data.py",
        "tests/test_pca_pipeline.py", "tests/test_rp_pca.py", "tests/test_types.py"]

  qualification:
    name: Qualify Release Candidate
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      release_version: ${{ needs.validate.outputs.version }}

  select-candidate:
    name: Select Qualified Candidate
    runs-on: ubuntu-latest
    needs: [validate, ecosystem-qualification, qualification]
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0

      - name: Download the candidate qualified by CI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: candidate

      - name: Verify candidate commit, tree, version, and SHA256 manifest
        run: >-
          python scripts/ci/candidate.py verify candidate
          --expected-commit "${{ needs.validate.outputs.commit }}"
          --expected-tree "${{ needs.validate.outputs.tree }}"
          --expected-tag "v${{ needs.validate.outputs.version }}"

      - name: Retain the selected candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualified-release-candidate
          path: candidate/
          if-no-files-found: error
          retention-days: 90

  docs:
    name: Publish Qualified Documentation
    runs-on: ubuntu-latest
    needs: [validate, select-candidate]
    environment: documentation
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.10.9"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-release-candidate
          path: candidate

      - name: Verify selected candidate
        run: >-
          python scripts/ci/candidate.py verify candidate
          --expected-commit "${{ needs.validate.outputs.commit }}"
          --expected-tree "${{ needs.validate.outputs.tree }}"
          --expected-tag "v${{ needs.validate.outputs.version }}"

      - name: Build revision-identified documentation
        env:
          ML4T_DOCS_COMMIT: ${{ needs.validate.outputs.commit }}
          ML4T_DOCS_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          uv sync --locked --dev --extra docs --python 3.12
          uv run mkdocs build --strict
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("site/release.json").write_text(
              json.dumps(
                  {
                      "commit": os.environ["ML4T_DOCS_COMMIT"],
                      "library": "models",
                      "version": os.environ["ML4T_DOCS_VERSION"],
                  },
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Require deploy credentials
        env:
          DOCS_DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
        run: test -n "$DOCS_DEPLOY_KEY"

      - name: Deploy stable documentation
        uses: cpina/github-action-push-to-another-repository@55306faa4ed53b815ae49e564af8cfb359d32ae2 # v1.7.3
        env:
          SSH_DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
        with:
          source-directory: site/
          destination-github-username: ml4t
          destination-repository-name: website
          target-directory: static/docs/models/
          target-branch: main
          commit-message: "docs(models): publish v${{ needs.validate.outputs.version }} from ${{ needs.validate.outputs.commit }}"
          user-name: ml4t-bot
          user-email: bot@ml4trading.io

      - name: Deploy versioned documentation
        uses: cpina/github-action-push-to-another-repository@55306faa4ed53b815ae49e564af8cfb359d32ae2 # v1.7.3
        env:
          SSH_DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
        with:
          source-directory: site/
          destination-github-username: ml4t
          destination-repository-name: website
          target-directory: static/docs/models/releases/${{ needs.validate.outputs.version }}/
          target-branch: main
          commit-message: "docs(models): retain v${{ needs.validate.outputs.version }} from ${{ needs.validate.outputs.commit }}"
          user-name: ml4t-bot
          user-email: bot@ml4trading.io

      - name: Verify deployed documentation identity
        env:
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: uv run python scripts/ci/verify_docs_deployment.py

  publish:
    name: Publish Exact Candidate to PyPI
    runs-on: ubuntu-latest
    needs: [validate, ecosystem-qualification, select-candidate, docs]
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-release-candidate
          path: candidate

      - name: Publish the qualified artifacts
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: candidate/dist/
          verify-metadata: true
          print-hash: true
          attestations: true

  github-release:
    name: Create Commit-Bound GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, publish]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-release-candidate
          path: candidate

      - name: Create tag and release from the candidate commit
        env:
          CANDIDATE_COMMIT: ${{ needs.validate.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          args=(
            "v${RELEASE_VERSION}"
            --repo "${{ github.repository }}"
            --target "$CANDIDATE_COMMIT"
            --generate-notes
            candidate/dist/*
            candidate/candidate.json
          )
          if [[ "$RELEASE_VERSION" =~ (a|b|rc)[0-9]+$ ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"

  verify-release:
    name: Verify Published Release
    runs-on: ubuntu-latest
    needs: [validate, github-release]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.10.9"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-release-candidate
          path: candidate

      - name: Verify PyPI metadata and artifact SHA256 digests
        run: python scripts/ci/release.py verify candidate

      - name: Install the published wheel and execute the README quick start
        run: >-
          python scripts/ci/release.py smoke-test
          ml4t-models "${{ needs.validate.outputs.version }}"
          scripts/ci/readme_smoke.py

      - name: Download and verify GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mkdir -p released/dist
          gh release download "v${RELEASE_VERSION}" --repo "${{ github.repository }}" \
            --pattern candidate.json --dir released
          gh release download "v${RELEASE_VERSION}" --repo "${{ github.repository }}" \
            --pattern '*.whl' --pattern '*.tar.gz' --dir released/dist
          python scripts/ci/candidate.py verify released \
            --expected-commit "${{ needs.validate.outputs.commit }}" \
            --expected-tree "${{ needs.validate.outputs.tree }}" \
            --expected-tag "v${RELEASE_VERSION}"

      - name: Repeat deployed documentation identity check
        env:
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: python scripts/ci/verify_docs_deployment.py

  recovery:
    name: Record Post-Publication Recovery
    runs-on: ubuntu-latest
    needs: [validate, publish, github-release, verify-release]
    if: >-
      ${{ always() && needs.validate.result == 'success' &&
      needs.publish.result != 'skipped' &&
      (needs.publish.result != 'success' || needs.github-release.result != 'success' ||
      needs.verify-release.result != 'success') }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Check whether publication crossed the PyPI boundary
        id: publication
        continue-on-error: true
        run: >-
          python scripts/ci/release.py publication-exists
          ml4t-models "${{ needs.validate.outputs.version }}"

      - name: Create the recovery issue once
        if: ${{ steps.publication.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          marker="release-recovery:v${RELEASE_VERSION}:${RELEASE_COMMIT}"
          if gh issue list --repo "${{ github.repository }}" --state all \
            --search "$marker" --json number --jq 'length' | grep -qx '0'; then
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "Recover incomplete v${RELEASE_VERSION} publication" \
              --body "PyPI accepted v${RELEASE_VERSION} from ${RELEASE_COMMIT}, but a later release stage failed. Inspect workflow run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Rerun only failed jobs so the retained candidate is reused. Do not rebuild or reuse this version for different bytes. ${marker}"
          fi
