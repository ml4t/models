name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ecosystem-qualification:
    name: Ecosystem Qualification
    permissions:
      contents: read
    uses: ml4t/ecosystem/.github/workflows/qualify-library.yml@457678d8860d0c816b1dc376e7e2691daa93af4d # v0.1.0
    with:
      import-package: ml4t.models
      prerelease-test-paths: >-
        ["tests/test_configs.py", "tests/test_forecasters.py", "tests/test_integration_data.py",
        "tests/test_pca_pipeline.py", "tests/test_rp_pca.py", "tests/test_types.py"]

  select-candidate:
    name: Select Qualified Candidate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Find successful main CI run
        id: ci-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow ci.yml \
            --commit "${{ github.sha }}" \
            --branch main \
            --event push \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"
          if [[ -z "$run_id" ]]; then
            echo "No successful main CI run exists for ${{ github.sha }}" >&2
            exit 1
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download qualified candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download "${{ steps.ci-run.outputs.run-id }}"
          --repo "${{ github.repository }}"
          --name release-candidate
          --dir candidate

      - name: Verify tag and candidate identity
        run: >-
          python scripts/ci/candidate.py verify candidate
          --expected-commit "${{ github.sha }}"
          --expected-tree "$(git rev-parse HEAD^{tree})"
          --expected-tag "${{ github.ref_name }}"

      - name: Retain selected candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualified-release-candidate
          path: candidate/
          if-no-files-found: error

  docs:
    name: Publish Qualified Documentation
    runs-on: ubuntu-latest
    needs: select-candidate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download selected candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-release-candidate
          path: candidate

      - name: Resolve release identity
        id: identity
        run: |
          version="$(python -c 'import json; print(json.load(open("candidate/candidate.json"))["version"])')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build revision-identified documentation
        env:
          ML4T_DOCS_VERSION: ${{ steps.identity.outputs.version }}
          ML4T_DOCS_COMMIT: ${{ github.sha }}
        run: |
          uv sync --dev --extra docs --python "${{ steps.setup-python.outputs.python-path }}"
          uv run mkdocs build --strict
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("site/release.json").write_text(
              json.dumps(
                  {
                      "commit": os.environ["ML4T_DOCS_COMMIT"],
                      "version": os.environ["ML4T_DOCS_VERSION"],
                  },
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Require deploy credentials
        env:
          DOCS_DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
        run: |
          if [[ -z "$DOCS_DEPLOY_KEY" ]]; then
            echo "DOCS_DEPLOY_KEY is required for a stable release" >&2
            exit 1
          fi

      - name: Deploy stable documentation
        uses: cpina/github-action-push-to-another-repository@55306faa4ed53b815ae49e564af8cfb359d32ae2 # v1.7.3
        env:
          SSH_DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
        with:
          source-directory: site/
          destination-github-username: ml4t
          destination-repository-name: website
          target-directory: static/docs/models/
          target-branch: main
          commit-message: "docs(models): publish ${{ github.ref_name }} from ${{ github.sha }}"
          user-name: ml4t-bot
          user-email: bot@ml4trading.io

      - name: Deploy versioned documentation
        uses: cpina/github-action-push-to-another-repository@55306faa4ed53b815ae49e564af8cfb359d32ae2 # v1.7.3
        env:
          SSH_DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
        with:
          source-directory: site/
          destination-github-username: ml4t
          destination-repository-name: website
          target-directory: static/docs/models/releases/${{ steps.identity.outputs.version }}/
          target-branch: main
          commit-message: "docs(models): retain ${{ github.ref_name }} from ${{ github.sha }}"
          user-name: ml4t-bot
          user-email: bot@ml4trading.io

      - name: Verify deployed documentation identity
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: uv run python scripts/ci/verify_docs_deployment.py

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [ecosystem-qualification, select-candidate, docs]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download selected candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-release-candidate
          path: candidate

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: candidate/dist/
          print-hash: true

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - name: Download selected candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-release-candidate
          path: candidate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          args=(
            "$tag"
            --repo "${{ github.repository }}"
            --generate-notes
            candidate/dist/*
            candidate/candidate.json
          )
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(a|b|rc)[0-9]+$ ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
