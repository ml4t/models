name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-candidate:
    name: Select Qualified Candidate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Find successful main CI run
        id: ci-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow ci.yml \
            --commit "${{ github.sha }}" \
            --branch main \
            --event push \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"
          if [[ -z "$run_id" ]]; then
            echo "No successful main CI run exists for ${{ github.sha }}" >&2
            exit 1
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download qualified candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download "${{ steps.ci-run.outputs.run-id }}"
          --repo "${{ github.repository }}"
          --name release-candidate
          --dir candidate

      - name: Verify tag and candidate identity
        run: >-
          python scripts/ci/candidate.py verify candidate
          --expected-commit "${{ github.sha }}"
          --expected-tree "$(git rev-parse HEAD^{tree})"
          --expected-tag "${{ github.ref_name }}"

      - name: Retain selected candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualified-release-candidate
          path: candidate/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: select-candidate
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download selected candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-release-candidate
          path: candidate

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: candidate/dist/
          print-hash: true

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - name: Download selected candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-release-candidate
          path: candidate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          args=("$tag" --generate-notes candidate/dist/* candidate/candidate.json)
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(a|b|rc)[0-9]+$ ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
