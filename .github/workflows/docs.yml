name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "docs"
  cancel-in-progress: true

jobs:
  build:
    name: Build & Deploy Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev --extra docs --python "${{ steps.setup-python.outputs.python-path }}"

      - name: Build docs
        run: uv run mkdocs build --strict

      - name: Check deploy credentials
        id: deploy-credentials
        env:
          DOCS_DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
        run: |
          if [[ -n "$DOCS_DEPLOY_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to website repo
        if: ${{ steps.deploy-credentials.outputs.available == 'true' }}
        uses: cpina/github-action-push-to-another-repository@55306faa4ed53b815ae49e564af8cfb359d32ae2 # v1.7.3
        env:
          SSH_DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
        with:
          source-directory: site/
          destination-github-username: ml4t
          destination-repository-name: website
          target-directory: static/docs/models/
          target-branch: main
          commit-message: "docs(models): update from ml4t/models@${{ github.sha }}"
          user-name: ml4t-bot
          user-email: bot@ml4trading.io
